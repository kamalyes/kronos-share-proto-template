syntax = "proto3";

import "protoc-gen-openapiv2/options/annotations.proto";
import "proto/common/common.proto";

option go_package = "github.com/kamalyes/kronos-share-proto-template/pb/access_control";
option java_package = "com.kamalyes.kronos.api.access_control";
package kronos.api.access_control;

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Kronos Auth Service"
    description: "鉴权服务：网关在每个请求前调它判断是否放行，并取回调用者身份 | Authorization service: the gateway calls it before every request to decide whether to allow it and to retrieve the caller's identity"
    version: "1.0.0"
  }
  tags: [
    {
      name: "Authorization"
      description: "鉴权 | Authorization"
    }
  ]
};

//===========================  这个服务在架构里的位置 | Where this service sits  ==========================//
//
// 网关是唯一讲 HTTP 的进程，它在把请求转发给下游之前先问这里：
//
//   浏览器 ──HTTP──▶ 网关 ──Authorities(path, method)──▶ 本服务
//                     │                                    │
//                     │◀────── allowed + Payload ──────────┘
//                     │
//                     └──gRPC（Payload 注入 header）──▶ 业务服务
//
// 两条关键约束：
//
// 一、Authorities 没有 google.api.http 注解，刻意不暴露 HTTP 路由
//
// 它是网关专用的内部 RPC。给它一个 HTTP 路由意味着任何能打到网关的人都能
// 直接调鉴权接口——而鉴权接口的返回值里带着 Payload（用户身份）。
// 那等于提供一个「拿 token 换身份信息」的公开端点，而且绕过了所有业务鉴权。
//
// 二、下游业务服务不重复验 token
//
// 验一次就够。验两次意味着两处逻辑要永远一致，而它们迟早不一致——
// 不一致时「网关放行、下游拒绝」是好结果，「网关拒绝、下游放行」才是事故。
// 所以验证收敛在网关一处，下游只信 header 里的 Payload。
//
// 这条约束的前提是**下游服务不能直接暴露给外网**：它信任 header，
// 谁能直连它谁就能伪造任意用户。部署时靠网络策略保证，不是靠代码。
//
// [EN] The gateway is the only process that speaks HTTP and asks this service before forwarding
// a request. Two constraints follow. First, Authorities carries no google.api.http annotation
// and deliberately has no HTTP route: it is an internal RPC for the gateway, and a route would
// let anyone who can reach the gateway call authorization directly, whose response carries the
// caller's payload — a public token-for-identity endpoint that bypasses every business check.
// Second, downstream services do not re-verify the token. Verifying once is enough; verifying
// twice means two implementations that must agree forever and eventually will not, where
// "gateway allows, downstream rejects" is the good outcome and the reverse is an incident.
// Verification is concentrated in the gateway and downstream trusts the payload in the header,
// which makes it mandatory that downstream services are never exposed directly, enforced by
// network policy rather than by code.

//===========================  消息定义 | Message Definitions  ==========================//

// 鉴权策略。
// [EN] Authorization policy
//
// 字段名用 v1/v2 而不是 path/method，是为了与 Casbin 的请求格式对齐——
// Casbin 的 enforcer 接受的是 (sub, obj, act) 这样的位置参数，
// 策略表里列名就是 v0/v1/v2。沿用这套命名让策略可以直接喂给 enforcer，
// 不必在中间再做一层字段改名。
//
// 代价是可读性差：看到 v1 不知道是 path。所以注释里必须写清楚，
// 而且顺序一旦定下来不能改——改了会让所有既有策略静默错位。
//
// [EN] Named v1 and v2 rather than path and method to match Casbin's request format, whose
// enforcer takes positional arguments and whose policy table columns are v0, v1 and v2. Keeping
// the names lets a policy feed the enforcer directly with no renaming layer in between. The
// cost is readability, so the comment must spell it out, and the order must never change: doing
// so silently misaligns every existing policy.
message AuthoritiesPolicy {
  string v1 = 1;                       // URL 路径 | [EN] URL path
  string v2 = 2;                       // HTTP 方法 | [EN] HTTP method
}

// 鉴权请求。
// [EN] Authorities request
//
// 请求里没有 token 字段：token 在 metadata 的 authorization 头里，
// 由网关的 ForwardOutgoingContext 整体透传过来。
// 放进请求体会让它出现在访问日志、链路追踪的 span 属性里——
// 那些地方的保留期通常远长于 token 的有效期。
//
// [EN] No token field: the token travels in the authorization metadata header, forwarded
// wholesale by the gateway. In the body it would land in access logs and trace span attributes,
// whose retention usually far outlives the token itself.
message AuthoritiesRequest {
  AuthoritiesPolicy policy = 1;        // 鉴权策略 | [EN] Authorization policy @inject_tag: validate:"required"
}

// 鉴权响应。
// [EN] Authorities response
message AuthoritiesResponse {
  // allowed 是否放行
  // [EN] Whether the request is allowed
  bool allowed = 1;

  // payload 调用者身份；allowed 为 false 时可为空
  // [EN] The caller's identity; may be empty when allowed is false
  common.Payload payload = 2;

  // reason 拒绝原因
  //
  // 这个字段会被网关直接回给调用方，所以**不要往里写内部细节**
  // （策略表行号、SQL、用户是否存在）。它的用途是让调用方知道
  // 「因为什么被拒」而不是「系统内部发生了什么」。
  //
  // [EN] Returned to the caller verbatim by the gateway, so it must not carry internal detail
  // such as policy row numbers, SQL or whether a user exists. Its purpose is to say why the
  // request was refused, not what happened inside the system.
  string reason = 3;

  // token_valid 令牌本身是否有效
  //
  // 这个字段决定网关返回 401 还是 403，两者对调用方的含义完全不同：
  //   false → 未认证（token 缺失/过期/伪造）→ 401 → 客户端该去重新登录
  //   true  → 已认证但权限不足              → 403 → 重新登录也没用
  // 混为一谈会让前端在权限不足时反复跳登录页，用户陷在登录循环里。
  //
  // [EN] Decides whether the gateway answers 401 or 403, which mean different things: false is
  // unauthenticated, from a missing, expired or forged token, and the client should log in
  // again; true is authenticated but insufficiently authorized, where logging in again changes
  // nothing. Conflating them sends the frontend back to the login page on every permission
  // error and traps the user in a login loop.
  bool token_valid = 4;
}

//===========================  服务定义 | Service Definition  ==========================//

// 鉴权服务
// [EN] Authorization service
service AuthService {
  // 判断请求是否放行，并返回调用者身份
  //
  // 刻意没有 google.api.http 注解，见文件开头的说明。
  // 网关从连接池拿连接直接建 client 调它，不经 HTTP。
  //
  // [EN] Deliberately without a google.api.http annotation, as the file header explains. The
  // gateway builds a client from its connection pool and calls it over gRPC, never HTTP.
  rpc Authorities(AuthoritiesRequest) returns (AuthoritiesResponse);
}
