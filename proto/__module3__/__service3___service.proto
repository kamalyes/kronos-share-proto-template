syntax = "proto3";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "proto/common/common.proto";
import "proto/enums/enums.proto";

option go_package = "<% .ModuleName %>/pb/<% .MixedModule %>";
option java_package = "<% .JavaPackage %>.<% .MixedModule %>";
package <% .ProtoPackage %>.<% .MixedModule %>;

// 混合模块示例（聚合根）| Mixed module example (aggregate root)
//
// 前两个示例模块是「一个模块一个 service」的干净 CRUD，真实项目里更常见的是这种：
// 一个模块下多个 service 文件，共用模块级的实体与枚举，接口里混着三类形态
//   1. 标准 CRUD —— 创建、详情、列表、更新、删除
//   2. 动作型 RPC —— 不是对资源字段的增删改，而是触发一次行为（这里是重试同步）
//   3. 子资源 —— 挂在聚合根下、有独立 ID、需要单独增改删（这里是地区分配）
//
// 同模块的第二个 service 见 <% .MixedService | snake %>_member_service.proto
//
// [EN] The first two example modules are clean one-service-per-module CRUD. Real projects
// look more like this: several service files in one module, sharing module-level entities
// and enums, with three kinds of endpoint mixed together — standard CRUD, action-style RPCs
// that trigger behaviour rather than edit fields, and sub-resources with their own IDs.
// The module's second service lives in <% .MixedService | snake %>_member_service.proto

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "<% .OrgPrefix | pascal %> <% .MixedService | pascal %> Service"
    description: "<% .MixedService | pascal %> 管理服务（混合示例：CRUD + 动作型接口 + 子资源） | <% .MixedService | pascal %> management service (mixed example: CRUD + action endpoints + sub-resources)"
    version: "1.0.0"
  }
  tags: [
    {
      name: "<% .MixedService | pascal %>Management"
      description: "<% .MixedService | pascal %> 管理 | <% .MixedService | pascal %> Management"
    }
  ]
};

//===========================  <% .MixedService | pascal %> 消息定义 | <% .MixedService | pascal %> Message Definitions  ==========================//

// 创建<% .MixedService | pascal %>请求
// [EN] Create <% .MixedService | pascal %> request
message <% .MixedService | pascal %>CreateRequest {
  string code = 1;                                      // 编码（全局唯一，创建后不可改）| [EN] Code, globally unique and immutable @inject_tag: validate:"required,min=2,max=32"
  string name = 2;                                      // 名称 | [EN] Name @inject_tag: validate:"required,min=2,max=64"
  string platform_id = 3;                               // 平台ID | [EN] Platform ID @inject_tag: validate:"required"
  repeated string region_ids = 4;                       // 初始地区列表 | [EN] Initial region list @inject_tag: validate:"omitempty,max=20"
  string owner_user_id = 5;                             // 所有者用户ID | [EN] Owner user ID @inject_tag: validate:"required"
}

// 创建<% .MixedService | pascal %>响应
// [EN] Create <% .MixedService | pascal %> response
message <% .MixedService | pascal %>CreateResponse {
  common.<% .MixedService | pascal %>Info info = 1;     // <% .MixedService | pascal %>信息 | [EN] <% .MixedService | pascal %> info
}

// 获取<% .MixedService | pascal %>详情请求
// [EN] Get <% .MixedService | pascal %> detail request
message <% .MixedService | pascal %>GetRequest {
  string <% .MixedService | snake %>_id = 1;            // <% .MixedService | pascal %>ID | [EN] <% .MixedService | pascal %> ID @inject_tag: validate:"required"
}

// 获取<% .MixedService | pascal %>详情响应
// [EN] Get <% .MixedService | pascal %> detail response
message <% .MixedService | pascal %>GetResponse {
  common.<% .MixedService | pascal %>Info info = 1;     // <% .MixedService | pascal %>信息 | [EN] <% .MixedService | pascal %> info
}

// <% .MixedService | pascal %>列表请求
// [EN] <% .MixedService | pascal %> list request
message <% .MixedService | pascal %>ListRequest {
  common.Paging page_request = 1;                       // 分页请求 | [EN] Page request @inject_tag: validate:"required"
  common.Sorting sort = 2;                              // 排序 | [EN] Sorting
  google.protobuf.StringValue keyword = 3;              // 关键词（编码、名称）| [EN] Keyword (code, name)
  enums.<% .MixedService | pascal %>Status status = 4;  // 状态 | [EN] Status
  google.protobuf.StringValue region_id = 5;            // 按地区过滤 | [EN] Filter by region
}

// <% .MixedService | pascal %>列表响应
// [EN] <% .MixedService | pascal %> list response
message <% .MixedService | pascal %>ListResponse {
  common.Paging page_response = 1;                            // 分页响应 | [EN] Page response
  repeated common.<% .MixedService | pascal %>Info infos = 2;  // 列表 | [EN] List
}

// 更新<% .MixedService | pascal %>请求
// [EN] Update <% .MixedService | pascal %> request
message <% .MixedService | pascal %>UpdateRequest {
  string <% .MixedService | snake %>_id = 1;            // <% .MixedService | pascal %>ID | [EN] <% .MixedService | pascal %> ID @inject_tag: validate:"required"
  google.protobuf.StringValue name = 2;                 // 名称 | [EN] Name
  enums.<% .MixedService | pascal %>Status status = 3;  // 状态 | [EN] Status
}

// 更新<% .MixedService | pascal %>响应
// [EN] Update <% .MixedService | pascal %> response
message <% .MixedService | pascal %>UpdateResponse {
  common.<% .MixedService | pascal %>Info info = 1;     // <% .MixedService | pascal %>信息 | [EN] <% .MixedService | pascal %> info
}

// 删除<% .MixedService | pascal %>请求
// [EN] Delete <% .MixedService | pascal %> request
message <% .MixedService | pascal %>DeleteRequest {
  string <% .MixedService | snake %>_id = 1;            // <% .MixedService | pascal %>ID | [EN] <% .MixedService | pascal %> ID @inject_tag: validate:"required"
}

//===========================  动作型接口消息 | Action Endpoint Messages  ==========================//

// 重试同步请求
// [EN] Retry sync request
// 动作型接口也要有自己的 Request/Response，不要复用 GetRequest：
// 以后加「只同步某个下游」这种参数时才有地方放
// [EN] An action endpoint needs its own request/response rather than reusing GetRequest,
// so that parameters like "sync only this downstream" have somewhere to live later
message <% .MixedService | pascal %>RetrySyncRequest {
  string <% .MixedService | snake %>_id = 1;            // <% .MixedService | pascal %>ID | [EN] <% .MixedService | pascal %> ID @inject_tag: validate:"required"
  google.protobuf.BoolValue force = 2;                  // 是否强制重新同步已成功的项 | [EN] Whether to re-sync already succeeded items
}

// 重试同步响应
// [EN] Retry sync response
message <% .MixedService | pascal %>RetrySyncResponse {
  enums.<% .MixedService | pascal %>SyncState sync_state = 1;  // 本次动作后的同步状态 | [EN] Sync state after this action
  string message = 2;                                          // 结果说明 | [EN] Result description
}

//===========================  子资源消息 | Sub-resource Messages  ==========================//

// 分配地区请求
// [EN] Assign region request
message <% .MixedService | pascal %>RegionAssignRequest {
  string <% .MixedService | snake %>_id = 1;            // <% .MixedService | pascal %>ID | [EN] <% .MixedService | pascal %> ID @inject_tag: validate:"required"
  string region_id = 2;                                 // 地区ID | [EN] Region ID @inject_tag: validate:"required"
  bool primary = 3;                                     // 是否设为主地区 | [EN] Whether to set as primary
}

// 分配地区响应
// [EN] Assign region response
message <% .MixedService | pascal %>RegionAssignResponse {
  common.<% .MixedService | pascal %>RegionAssignment assignment = 1;  // 地区分配 | [EN] Region assignment
}

// 更新地区分配请求
// [EN] Update region assignment request
message <% .MixedService | pascal %>RegionAssignmentUpdateRequest {
  string <% .MixedService | snake %>_id = 1;            // <% .MixedService | pascal %>ID | [EN] <% .MixedService | pascal %> ID @inject_tag: validate:"required"
  string assignment_id = 2;                             // 分配ID | [EN] Assignment ID @inject_tag: validate:"required"
  google.protobuf.BoolValue primary = 3;                // 是否主地区 | [EN] Whether primary
}

// 更新地区分配响应
// [EN] Update region assignment response
message <% .MixedService | pascal %>RegionAssignmentUpdateResponse {
  common.<% .MixedService | pascal %>RegionAssignment assignment = 1;  // 地区分配 | [EN] Region assignment
}

// 移除地区分配请求
// [EN] Remove region assignment request
message <% .MixedService | pascal %>RegionAssignmentRemoveRequest {
  string <% .MixedService | snake %>_id = 1;            // <% .MixedService | pascal %>ID | [EN] <% .MixedService | pascal %> ID @inject_tag: validate:"required"
  string assignment_id = 2;                             // 分配ID | [EN] Assignment ID @inject_tag: validate:"required"
}

//===========================  服务定义 | Service Definition  ==========================//

// <% .MixedService | pascal %> 管理服务
// [EN] <% .MixedService | pascal %> management service
service <% .MixedService | pascal %>Service {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "<% .MixedService | pascal %> 管理服务（CRUD + 动作型 + 子资源） | <% .MixedService | pascal %> management (CRUD + actions + sub-resources)"
  };

  // 创建<% .MixedService | pascal %>
  // [EN] Create <% .MixedService | pascal %>
  rpc <% .MixedService | pascal %>Create(<% .MixedService | pascal %>CreateRequest) returns (<% .MixedService | pascal %>CreateResponse) {
    option (google.api.http) = {
      post: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "创建<% .MixedService | pascal %> | Create <% .MixedService | pascal %>"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // 获取<% .MixedService | pascal %>详情
  // [EN] Get <% .MixedService | pascal %> detail
  rpc <% .MixedService | pascal %>Get(<% .MixedService | pascal %>GetRequest) returns (<% .MixedService | pascal %>GetResponse) {
    option (google.api.http) = {
      get: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s/{<% .MixedService | snake %>_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "获取<% .MixedService | pascal %>详情 | Get <% .MixedService | pascal %> detail"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // <% .MixedService | pascal %>列表
  // [EN] <% .MixedService | pascal %> list
  rpc <% .MixedService | pascal %>List(<% .MixedService | pascal %>ListRequest) returns (<% .MixedService | pascal %>ListResponse) {
    option (google.api.http) = {
      get: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "<% .MixedService | pascal %>列表 | <% .MixedService | pascal %> list"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // 更新<% .MixedService | pascal %>
  // [EN] Update <% .MixedService | pascal %>
  rpc <% .MixedService | pascal %>Update(<% .MixedService | pascal %>UpdateRequest) returns (<% .MixedService | pascal %>UpdateResponse) {
    option (google.api.http) = {
      put: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s/{<% .MixedService | snake %>_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "更新<% .MixedService | pascal %> | Update <% .MixedService | pascal %>"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // 删除<% .MixedService | pascal %>
  // [EN] Delete <% .MixedService | pascal %>
  rpc <% .MixedService | pascal %>Delete(<% .MixedService | pascal %>DeleteRequest) returns (common.GeneralEmptyResponse) {
    option (google.api.http) = {
      delete: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s/{<% .MixedService | snake %>_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "删除<% .MixedService | pascal %> | Delete <% .MixedService | pascal %>"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // 重试下游同步（动作型接口）
  // [EN] Retry downstream sync (action-style endpoint)
  // 动作型接口统一用 POST + 动词短横线路径，不要硬塞进 PUT/PATCH：
  // 它不是在改资源字段，重复调用的语义也不是幂等覆盖
  // [EN] Action endpoints use POST with a verb path instead of being forced into PUT/PATCH:
  // they do not edit fields, and repeating them is not an idempotent overwrite
  rpc <% .MixedService | pascal %>RetrySync(<% .MixedService | pascal %>RetrySyncRequest) returns (<% .MixedService | pascal %>RetrySyncResponse) {
    option (google.api.http) = {
      post: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s/{<% .MixedService | snake %>_id}/retry-sync"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "重试下游同步 | Retry downstream sync"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // 分配地区（子资源创建）
  // [EN] Assign a region (sub-resource create)
  rpc <% .MixedService | pascal %>RegionAssign(<% .MixedService | pascal %>RegionAssignRequest) returns (<% .MixedService | pascal %>RegionAssignResponse) {
    option (google.api.http) = {
      post: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s/{<% .MixedService | snake %>_id}/region-assignments"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "分配地区 | Assign region"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // 更新地区分配（子资源更新）
  // [EN] Update a region assignment (sub-resource update)
  rpc <% .MixedService | pascal %>RegionAssignmentUpdate(<% .MixedService | pascal %>RegionAssignmentUpdateRequest) returns (<% .MixedService | pascal %>RegionAssignmentUpdateResponse) {
    option (google.api.http) = {
      put: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s/{<% .MixedService | snake %>_id}/region-assignments/{assignment_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "更新地区分配 | Update region assignment"
      tags: "<% .MixedService | pascal %>Management"
    };
  }

  // 移除地区分配（子资源删除）
  // [EN] Remove a region assignment (sub-resource delete)
  rpc <% .MixedService | pascal %>RegionAssignmentRemove(<% .MixedService | pascal %>RegionAssignmentRemoveRequest) returns (common.GeneralEmptyResponse) {
    option (google.api.http) = {
      delete: "/v1/<% .MixedModule %>/<% .MixedService | kebab %>s/{<% .MixedService | snake %>_id}/region-assignments/{assignment_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "移除地区分配 | Remove region assignment"
      tags: "<% .MixedService | pascal %>Management"
    };
  }
}
