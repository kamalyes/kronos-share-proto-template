syntax = "proto3";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "proto/common/common.proto";
import "proto/enums/enums.proto";

option go_package = "<% .ModuleName %>/pb/<% .ExampleModule %>";
option java_package = "<% .JavaPackage %>.<% .ExampleModule %>";
package <% .ProtoPackage %>.<% .ExampleModule %>;

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "<% .OrgPrefix | pascal %> <% .ExampleService | pascal %> Service"
    description: "<% .ExampleService | pascal %> 管理服务（完整 CRUD 示例：POST/GET/PUT/PATCH/DELETE 全覆盖） | <% .ExampleService | pascal %> management service (full CRUD example covering POST/GET/PUT/PATCH/DELETE)"
    version: "1.0.0"
  }
  tags: [
    {
      name: "<% .ExampleService | pascal %>Management"
      description: "<% .ExampleService | pascal %> 管理 | <% .ExampleService | pascal %> Management"
    }
  ]
};

//===========================  <% .ExampleService | pascal %> 消息定义 | <% .ExampleService | pascal %> Message Definitions  ==========================//

// 创建<% .ExampleService | pascal %>请求。
// [EN] Create <% .ExampleService | pascal %> request
// 创建用裸类型 + validate:"required"，不要用 wrappers：创建场景没有「不传表示不改」的语义。
// [EN] Create uses plain types with validate:"required"; wrappers are for partial updates only
message <% .ExampleService | pascal %>CreateRequest {
  string tenant_id = 1;                                  // 租户ID | [EN] Tenant ID @inject_tag: validate:"required,tenant_id"
  string name = 2;                                       // 名称 | [EN] Name @inject_tag: validate:"required,min=2,max=64"
  string code = 3;                                       // 编码 | [EN] Code @inject_tag: validate:"required,min=2,max=32"
  enums.<% .ExampleService | pascal %>Type type = 4;     // 类型 | [EN] Type
  enums.<% .ExampleService | pascal %>Level level = 5;   // 等级 | [EN] Level
  common.<% .ExampleService | pascal %>Contact contact = 6; // 联系方式 | [EN] Contact
  repeated string tags = 7;                              // 标签列表 | [EN] Tag list
  string remark = 8;                                     // 备注 | [EN] Remark  @inject_tag: validate:"omitempty,max=255"
}

// 创建<% .ExampleService | pascal %>响应。
// [EN] Create <% .ExampleService | pascal %> response
message <% .ExampleService | pascal %>CreateResponse {
  common.<% .ExampleService | pascal %>Info info = 1;    // <% .ExampleService | pascal %>信息 | [EN] <% .ExampleService | pascal %> info
}

// 获取<% .ExampleService | pascal %>详情请求。
// [EN] Get <% .ExampleService | pascal %> detail request
message <% .ExampleService | pascal %>GetRequest {
  string <% .ExampleService | snake %>_id = 1;           // <% .ExampleService | pascal %>ID | [EN] <% .ExampleService | pascal %> ID @inject_tag: validate:"required"
}

// 获取<% .ExampleService | pascal %>详情响应。
// [EN] Get <% .ExampleService | pascal %> detail response
message <% .ExampleService | pascal %>GetResponse {
  common.<% .ExampleService | pascal %>Info info = 1;    // <% .ExampleService | pascal %>信息 | [EN] <% .ExampleService | pascal %> info
}

// <% .ExampleService | pascal %>列表请求。
// [EN] <% .ExampleService | pascal %> list request
// 过滤条件用 wrappers：区分「不过滤」和「过滤空值」。
// [EN] Filters use wrappers so "no filter" differs from "filter by empty value"
message <% .ExampleService | pascal %>ListRequest {
  common.Paging page_request = 1;                        // 分页请求 | [EN] Page request @inject_tag: validate:"required"
  common.Sorting sort = 2;                               // 排序 | [EN] Sorting
  google.protobuf.StringValue keyword = 3;               // 搜索关键词（名称、编码） | [EN] Search keyword (name, code)
  google.protobuf.StringValue tenant_id = 4;             // 租户ID | [EN] Tenant ID
  enums.<% .ExampleService | pascal %>Type type = 5;     // 类型 | [EN] Type
  enums.CommonStatus status = 6;                         // 状态 | [EN] Status
}

// <% .ExampleService | pascal %>列表响应。
// [EN] <% .ExampleService | pascal %> list response
message <% .ExampleService | pascal %>ListResponse {
  common.Paging page_response = 1;                       // 分页响应 | [EN] Page response
  repeated common.<% .ExampleService | pascal %>Info infos = 2; // <% .ExampleService | pascal %>信息列表 | [EN] <% .ExampleService | pascal %> info list
}

// 更新<% .ExampleService | pascal %>请求。
// [EN] Update <% .ExampleService | pascal %> request
message <% .ExampleService | pascal %>UpdateRequest {
  string <% .ExampleService | snake %>_id = 1;           // <% .ExampleService | pascal %>ID | [EN] <% .ExampleService | pascal %> ID @inject_tag: validate:"required"
  google.protobuf.StringValue name = 2;                  // 名称 | [EN] Name
  google.protobuf.StringValue remark = 3;                // 备注 | [EN] Remark
  enums.<% .ExampleService | pascal %>Level level = 4;   // 等级 | [EN] Level
  common.<% .ExampleService | pascal %>Contact contact = 5; // 联系方式 | [EN] Contact
  repeated string tags = 6;                              // 标签列表 | [EN] Tag list
  google.protobuf.BoolValue update_tags = 7;             // 是否更新标签(true=用 tags 覆盖, false/null=不动) | [EN] Whether to replace tags
}

// 更新<% .ExampleService | pascal %>响应。
// [EN] Update <% .ExampleService | pascal %> response
message <% .ExampleService | pascal %>UpdateResponse {
  common.<% .ExampleService | pascal %>Info info = 1;    // <% .ExampleService | pascal %>信息 | [EN] <% .ExampleService | pascal %> info
}

// 更新<% .ExampleService | pascal %>状态请求。
// [EN] Update <% .ExampleService | pascal %> status request
message <% .ExampleService | pascal %>UpdateStatusRequest {
  string <% .ExampleService | snake %>_id = 1;           // <% .ExampleService | pascal %>ID | [EN] <% .ExampleService | pascal %> ID @inject_tag: validate:"required"
  enums.CommonStatus status = 2;                         // 状态 | [EN] Status @inject_tag: validate:"required"
}

// 更新<% .ExampleService | pascal %>状态响应。
// [EN] Update <% .ExampleService | pascal %> status response
message <% .ExampleService | pascal %>UpdateStatusResponse {}

// 删除<% .ExampleService | pascal %>请求。
// [EN] Delete <% .ExampleService | pascal %> request
message <% .ExampleService | pascal %>DeleteRequest {
  string <% .ExampleService | snake %>_id = 1;           // <% .ExampleService | pascal %>ID | [EN] <% .ExampleService | pascal %> ID @inject_tag: validate:"required"
}

// 删除<% .ExampleService | pascal %>响应。
// [EN] Delete <% .ExampleService | pascal %> response
message <% .ExampleService | pascal %>DeleteResponse {}

// 批量删除<% .ExampleService | pascal %>请求。
// [EN] Batch delete <% .ExampleService | pascal %> request
// 批量操作走 POST + body，不用 DELETE：DELETE 带 body 在网关和代理上行为不一致。
// [EN] Batch operations use POST with a body; DELETE with a body behaves inconsistently across proxies
message <% .ExampleService | pascal %>BatchDeleteRequest {
  repeated string <% .ExampleService | snake %>_ids = 1; // <% .ExampleService | pascal %>ID列表 | [EN] <% .ExampleService | pascal %> ID list @inject_tag: validate:"required,max=100"
}

// 批量删除<% .ExampleService | pascal %>响应。
// [EN] Batch delete <% .ExampleService | pascal %> response
message <% .ExampleService | pascal %>BatchDeleteResponse {
  repeated common.BatchResult results = 1;               // 逐条结果 | [EN] Per-item results
}

//===========================  服务定义 | Service Definition  ==========================//

// <% .ExampleService | pascal %> 管理服务。
// [EN] <% .ExampleService | pascal %> management service
service <% .ExampleService | pascal %>Service {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "<% .ExampleService | pascal %> 管理服务（完整 CRUD 示例） | <% .ExampleService | pascal %> management service (full CRUD example)"
  };

  // 创建<% .ExampleService | pascal %>
  // [EN] Create <% .ExampleService | pascal %>
  rpc <% .ExampleService | pascal %>Create(<% .ExampleService | pascal %>CreateRequest) returns (<% .ExampleService | pascal %>CreateResponse) {
    option (google.api.http) = {
      post: "/v1/<% .ExampleModule %>/<% .ExampleService | kebab %>s"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "创建<% .ExampleService | pascal %> | Create <% .ExampleService | pascal %>"
      tags: "<% .ExampleService | pascal %>Management"
    };
  }

  // 获取<% .ExampleService | pascal %>详情。
  // [EN] Get <% .ExampleService | pascal %> detail
  rpc <% .ExampleService | pascal %>Get(<% .ExampleService | pascal %>GetRequest) returns (<% .ExampleService | pascal %>GetResponse) {
    option (google.api.http) = {
      get: "/v1/<% .ExampleModule %>/<% .ExampleService | kebab %>s/{<% .ExampleService | snake %>_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "获取<% .ExampleService | pascal %>详情 | Get <% .ExampleService | pascal %> detail"
      tags: "<% .ExampleService | pascal %>Management"
    };
  }

  // <% .ExampleService | pascal %>列表。
  // [EN] <% .ExampleService | pascal %> list
  rpc <% .ExampleService | pascal %>List(<% .ExampleService | pascal %>ListRequest) returns (<% .ExampleService | pascal %>ListResponse) {
    option (google.api.http) = {
      get: "/v1/<% .ExampleModule %>/<% .ExampleService | kebab %>s"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "<% .ExampleService | pascal %>列表 | <% .ExampleService | pascal %> list"
      tags: "<% .ExampleService | pascal %>Management"
    };
  }

  // 更新<% .ExampleService | pascal %>
  // [EN] Update <% .ExampleService | pascal %>
  rpc <% .ExampleService | pascal %>Update(<% .ExampleService | pascal %>UpdateRequest) returns (<% .ExampleService | pascal %>UpdateResponse) {
    option (google.api.http) = {
      put: "/v1/<% .ExampleModule %>/<% .ExampleService | kebab %>s/{<% .ExampleService | snake %>_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "更新<% .ExampleService | pascal %> | Update <% .ExampleService | pascal %>"
      tags: "<% .ExampleService | pascal %>Management"
    };
  }

  // 更新<% .ExampleService | pascal %>状态（局部更新）。
  // [EN] Update <% .ExampleService | pascal %> status (partial update)
  rpc <% .ExampleService | pascal %>UpdateStatus(<% .ExampleService | pascal %>UpdateStatusRequest) returns (<% .ExampleService | pascal %>UpdateStatusResponse) {
    option (google.api.http) = {
      patch: "/v1/<% .ExampleModule %>/<% .ExampleService | kebab %>s/{<% .ExampleService | snake %>_id}/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "更新<% .ExampleService | pascal %>状态 | Update <% .ExampleService | pascal %> status"
      tags: "<% .ExampleService | pascal %>Management"
    };
  }

  // 删除<% .ExampleService | pascal %>
  // [EN] Delete <% .ExampleService | pascal %>
  rpc <% .ExampleService | pascal %>Delete(<% .ExampleService | pascal %>DeleteRequest) returns (<% .ExampleService | pascal %>DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/<% .ExampleModule %>/<% .ExampleService | kebab %>s/{<% .ExampleService | snake %>_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "删除<% .ExampleService | pascal %> | Delete <% .ExampleService | pascal %>"
      tags: "<% .ExampleService | pascal %>Management"
    };
  }

  // 批量删除<% .ExampleService | pascal %>
  // [EN] Batch delete <% .ExampleService | pascal %>
  rpc <% .ExampleService | pascal %>BatchDelete(<% .ExampleService | pascal %>BatchDeleteRequest) returns (<% .ExampleService | pascal %>BatchDeleteResponse) {
    option (google.api.http) = {
      post: "/v1/<% .ExampleModule %>/<% .ExampleService | kebab %>s/batch-delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "批量删除<% .ExampleService | pascal %> | Batch delete <% .ExampleService | pascal %>"
      tags: "<% .ExampleService | pascal %>Management"
    };
  }
}
