syntax = "proto3";

option go_package = "<% .ModuleName %>/pb/enums";
option java_package = "<% .JavaPackage %>.enums";
package <% .ProtoPackage %>.enums;

// <% .MixedModule %> 模块枚举 | <% .MixedModule %> module enums
// 本模块下有多个 service 共用这些枚举，所以必须放在 enums/ 而不是某个 service 文件里
// [EN] Several services in this module share these enums, so they belong in enums/ rather than one service file

// <% .MixedService | pascal %> 状态
// [EN] <% .MixedService | pascal %> status
// 聚合根有自己的状态机（待激活 -> 正常 -> 冻结），不能复用 CommonStatus 的启用/禁用两态
// [EN] The aggregate root has its own state machine (pending -> normal -> frozen), which
// the two-state CommonStatus cannot express
enum <% .MixedService | pascal %>Status {
  <% .MixedService | snake | upper %>_STATUS_UNSPECIFIED = 0; // 未指定 | [EN] Unspecified
  <% .MixedService | snake | upper %>_STATUS_PENDING = 1;     // 待激活 | [EN] Pending activation
  <% .MixedService | snake | upper %>_STATUS_NORMAL = 2;      // 正常 | [EN] Normal
  <% .MixedService | snake | upper %>_STATUS_FROZEN = 3;      // 冻结 | [EN] Frozen
}

// 成员角色
// [EN] Member role
enum <% .MixedService | pascal %>MemberRole {
  <% .MixedService | snake | upper %>_MEMBER_ROLE_UNSPECIFIED = 0; // 未指定 | [EN] Unspecified
  <% .MixedService | snake | upper %>_MEMBER_ROLE_OWNER = 1;       // 所有者 | [EN] Owner
  <% .MixedService | snake | upper %>_MEMBER_ROLE_ADMIN = 2;       // 管理员 | [EN] Admin
  <% .MixedService | snake | upper %>_MEMBER_ROLE_VIEWER = 3;      // 只读 | [EN] Viewer
}

// 同步状态
// [EN] Sync state
// 动作型接口（重试同步）用它回报结果，避免用布尔值表达三种以上的结局
// [EN] Returned by the action-style retry endpoint; a bool cannot express more than two outcomes
enum <% .MixedService | pascal %>SyncState {
  <% .MixedService | snake | upper %>_SYNC_STATE_UNSPECIFIED = 0; // 未指定 | [EN] Unspecified
  <% .MixedService | snake | upper %>_SYNC_STATE_PENDING = 1;     // 待同步 | [EN] Pending
  <% .MixedService | snake | upper %>_SYNC_STATE_SYNCED = 2;      // 已同步 | [EN] Synced
  <% .MixedService | snake | upper %>_SYNC_STATE_FAILED = 3;      // 同步失败 | [EN] Failed
}
