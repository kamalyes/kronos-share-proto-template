# ============================================================================
# go-rpc-gateway 开发环境配置 | Development configuration
#
# 加载规则：bootstrap 以 WithPrefix("<% .ProjectName %>") + 环境名拼出文件名，
# 即本文件对应 environment=development新增环境就复制一份改名，例如
# <% .ProjectName %>-prod.yaml，并在 bootstrap/main.go 注册环境前缀。
#
# [EN] Loading rule: bootstrap combines WithPrefix("<% .ProjectName %>") with the
# environment name, so this file serves environment=development. Copy and rename it
# for another environment (e.g. <% .ProjectName %>-prod.yaml) and register the
# prefix in bootstrap/main.go.
# ============================================================================

name: "<% .ProjectName %> 文档网关 | docs gateway"
enabled: true
debug: true
version: "v1.0.0"
environment: "development"

# HTTP 服务器配置 | HTTP server
http:
  host: "0.0.0.0"
  port: <% .HTTPPort %>
  read-timeout: 30
  write-timeout: 30
  idle-timeout: 60

# Swagger 文档配置 | Swagger documentation
swagger:
  enabled: true
  hot-reload: true # 改完 proto 重新生成后无需重启 | no restart needed after regeneration
  json-path: "/swagger/doc.json"
  ui-path: "/swagger"
  yaml-path: "/swagger/doc.yaml"
  title: "<% .OrgPrefix | pascal %> Gateway API Documentation"
  description: "<% .ProjectName %> 聚合 API 文档 | aggregated API documentation"
  version: "1.0.0"

  # 聚合配置：把各模块的 swagger 合并成一个文档站。
  # [EN] Aggregation: merge every module's swagger into one docs site
  #
  # 新增服务后必须在 services 里登记，否则文档站看不到它。
  # [EN] Register new services here or the docs site will miss them
  aggregate:
    enabled: true
    mode: "merge" # merge: 合并为一个文档 | selector: 提供服务选择界面
    ui-layout: "tabs" # tabs | dropdown | list
    services:
      - name: "<% .ExampleService | pascal %>Service"
        description: "<% .ExampleService | pascal %> 管理服务（完整 CRUD 示例） | <% .ExampleService | pascal %> management (full CRUD example)"
        spec-path: "./proto/<% .ExampleModule %>/<% .ExampleService | snake %>_service.swagger.yaml"
        version: "1.0.0"
        enabled: true

      - name: "<% .SecondService | pascal %>Service"
        description: "<% .SecondService | pascal %> 管理服务（第二个 CRUD 示例） | <% .SecondService | pascal %> management (second CRUD example)"
        spec-path: "./proto/<% .SecondModule %>/<% .SecondService | snake %>_service.swagger.yaml"
        version: "1.0.0"
        enabled: true

      - name: "<% .MixedService | pascal %>Service"
        description: "<% .MixedService | pascal %> 管理服务（混合示例：CRUD + 动作型 + 子资源） | <% .MixedService | pascal %> management (mixed example)"
        spec-path: "./proto/<% .MixedModule %>/<% .MixedService | snake %>_service.swagger.yaml"
        version: "1.0.0"
        enabled: true

      - name: "<% .MixedService | pascal %>MemberService"
        description: "<% .MixedService | pascal %> 成员管理服务（同模块的第二个 service） | <% .MixedService | pascal %> member management (second service in the module)"
        spec-path: "./proto/<% .MixedModule %>/<% .MixedService | snake %>_member_service.swagger.yaml"
        version: "1.0.0"
        enabled: true

  # 独立文档入口：按受众拆分文档，避免把所有接口塞进一页。
  # 聚合文档（merge）给内部排查用，拆分入口给对外交付用：
  # 对外只暴露该受众真正能调的接口，而不是让对方在上百个接口里找自己那几个。
  # [EN] Standalone documents: split by audience instead of one giant page. The merged view
  # is for internal debugging; split entries are what you hand to a consumer, exposing only
  # the endpoints that audience can actually call.
  # - 管理端 | Admin: /swagger/documents/AdminService
  documents:
    - name: "AdminService"
      title: "管理端 API | Admin API"
      description: "<% .ProjectName %> 管理端接口 | admin-facing endpoints"
      version: "1.0.0"
      enabled: true
      sources:
        - service: "<% .ExampleService | pascal %>Service"
        - service: "<% .SecondService | pascal %>Service"
        - service: "<% .MixedService | pascal %>Service"
        - service: "<% .MixedService | pascal %>MemberService"
