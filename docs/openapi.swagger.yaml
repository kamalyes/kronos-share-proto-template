swagger: "2.0"
info:
  title: Kronos Share Proto API
  description: kronos-share-proto-template 聚合 OpenAPI 文档，由全部业务模块的 proto 合并生成，供 TypeScript/Java/Dart 等多语言 SDK 与 API 门户消费 | Aggregated OpenAPI document of kronos-share-proto-template, merged from every business module and consumed by TypeScript/Java/Dart SDK generators and API portals
  version: 1.0.0
  contact:
    email: example@qq.com
    name: kamalyes
    url: https://github.com/kamalyes/kronos-share-proto-template
tags:
  - name: ProductManagement
    description: Product 管理 | Product management
  - name: WarehouseManagement
    description: Warehouse 管理 | Warehouse management
  - name: TenantManagement
    description: Tenant 管理 | Tenant management
  - name: TenantMemberManagement
    description: Tenant 成员管理 | Tenant member management
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/catalog/products:
    get:
      summary: Product列表 | Product list
      operationId: ProductService_ProductList
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/catalogProductListResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_request.page
          description: 当前页码 | [EN] Current page number
          in: query
          required: false
          type: integer
          format: int32
          minimum: 1
        - name: page_request.size
          description: 每页条数（上限保护，防止一次拉全表） | [EN] Page size, capped to protect the backend
          in: query
          required: false
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        - name: page_request.total
          description: 总条数（响应字段，请求 query 不继承必填） | [EN] Total count
          in: query
          required: false
          type: integer
          format: int32
        - name: sort.field
          description: 排序字段 | [EN] Sort field
          in: query
          required: false
          type: string
        - name: sort.ascending
          description: 是否升序 | [EN] Whether ascending
          in: query
          required: false
          type: boolean
        - name: keyword
          description: 搜索关键词（名称、编码） | [EN] Search keyword (name, code)
          in: query
          required: false
          type: string
        - name: tenant_id
          description: 租户ID | [EN] Tenant ID
          in: query
          required: false
          type: string
        - name: type
          description: |-
            类型 | [EN] Type

             - PRODUCT_TYPE_UNSPECIFIED: 未指定 | [EN] Unspecified
             - PRODUCT_TYPE_PERSONAL: 个人 | [EN] Personal
             - PRODUCT_TYPE_ORGANIZATION: 组织 | [EN] Organization
          in: query
          required: false
          type: string
          enum:
            - PRODUCT_TYPE_UNSPECIFIED
            - PRODUCT_TYPE_PERSONAL
            - PRODUCT_TYPE_ORGANIZATION
          default: PRODUCT_TYPE_UNSPECIFIED
        - name: status
          description: |-
            状态 | [EN] Status

             - COMMON_STATUS_UNSPECIFIED: 未指定 | [EN] Unspecified
             - COMMON_STATUS_NORMAL: 正常 | [EN] Normal
             - COMMON_STATUS_DISABLED: 禁用 | [EN] Disabled
          in: query
          required: false
          type: string
          enum:
            - COMMON_STATUS_UNSPECIFIED
            - COMMON_STATUS_NORMAL
            - COMMON_STATUS_DISABLED
          default: COMMON_STATUS_UNSPECIFIED
      tags:
        - ProductManagement
    post:
      summary: 创建Product | Create Product
      operationId: ProductService_ProductCreate
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/catalogProductCreateResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
