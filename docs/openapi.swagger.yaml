       - TENANT_STATUS_PENDING: 待激活 | [EN] Pending activation
       - TENANT_STATUS_NORMAL: 正常 | [EN] Normal
       - TENANT_STATUS_FROZEN: 冻结 | [EN] Frozen
    title: |-
      Tenant 状态
      [EN] Tenant status
      聚合根有自己的状态机（待激活 -> 正常 -> 冻结），不能复用 CommonStatus 的启用/禁用两态
      [EN] The aggregate root has its own state machine (pending -> normal -> frozen), which
      the two-state CommonStatus cannot express
  enumsTenantSyncState:
    type: string
